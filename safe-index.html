<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0000"><title>فحص الجهاز</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;height:100dvh;background:#050000;color:#fff;font-family:"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;height:100dvh;background:radial-gradient(circle at 50% 30%,#3a0000 0%,#120000 55%,#000 100%);transition:background 1.2s}
#app.danger{animation:pulseBg 1.2s infinite}
#app.safe{animation:none;background:radial-gradient(circle at 50% 30%,#06381d 0%,#031a0d 55%,#000 100%)}
@keyframes pulseBg{0%,100%{background:radial-gradient(circle at 50% 30%,#4a0000,#120000 55%,#000)}50%{background:radial-gradient(circle at 50% 30%,#7a0000,#200000 55%,#000)}}
canvas#rain{position:fixed;inset:0;opacity:.18;pointer-events:none;transition:opacity 1s}
#app.safe canvas#rain{opacity:.07}
#app::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0004 2px 3px);z-index:3}
.scr{position:absolute;inset:0;padding:max(18px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;justify-content:space-evenly;text-align:center;overflow-y:auto}
.scr.on{display:flex;animation:in .5s}
@keyframes in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.scan-t{font-size:clamp(30px,9.4vw,50px);font-weight:900;color:#ffb000;text-shadow:0 0 6px #ff8a00,0 0 22px #ff6a00,0 0 44px #ff3d0066;position:relative;animation:flick 3s infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.65}}
.scan-s{font-size:clamp(13px,3.8vw,17px);color:#ffcf70;letter-spacing:2px;margin-top:6px;direction:ltr;font-family:monospace}
.dots::after{content:"";animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.ring{width:min(60vw,28dvh,270px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(#ffb000 var(--p,0%),#2a1200 0);position:relative;box-shadow:0 0 40px #ff6a0044;transition:background .3s}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#0b0000}
.ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:conic-gradient(from 0deg,#ffb00000 0 75%,#ffb00055 100%);animation:sw 1.4s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.num{position:relative;z-index:1;font-size:clamp(80px,26vw,140px);font-weight:900;text-shadow:0 0 25px #f22,0 0 60px #f00;line-height:1}
.num.pop{animation:pop .9s}@keyframes pop{0%{transform:scale(1.5);opacity:.2}30%{opacity:1}100%{transform:scale(1)}}
.bar{width:92vw;max-width:520px;height:10px;background:#2a1200;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb000,#ff3d00);transition:width 1s linear}
#sub{color:#d99;font-size:clamp(14px,4vw,18px);direction:ltr;font-family:monospace;min-height:1.4em}
.apps{width:96vw;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,3vw,18px) clamp(8px,2.5vw,14px)}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:clamp(11px,3.2vw,15px);font-weight:600;color:#ddd;position:relative}
.app svg{width:100%;aspect-ratio:1;border-radius:22%}
.app.hit::after{content:"✓";position:absolute;top:-8px;inset-inline-start:0;background:#1e90ff;color:#fff;font-weight:900;text-align:center;border-radius:50%;width:clamp(22px,6.4vw,30px);height:clamp(22px,6.4vw,30px);font-size:clamp(13px,3.9vw,18px);line-height:clamp(22px,6.4vw,30px);border:2px solid #050000;box-shadow:0 0 12px #1e90ff,0 0 24px #1e90ff88;animation:p2 .4s}
@keyframes p2{from{transform:scale(0)}to{transform:scale(1)}}
.app.hit svg{filter:drop-shadow(0 0 8px #ff2a2a)}
.eagle{height:min(40dvh,330px);max-width:80vw;object-fit:contain;filter:drop-shadow(0 0 22px #f00a);animation:glitch 1.6s infinite}
@keyframes glitch{0%,90%,100%{transform:none}92%{transform:translate(-5px,2px) skewX(6deg)}94%{transform:translate(6px,-2px)}96%{transform:translate(-3px,0) skewX(-6deg)}}
.check{width:min(38vw,20dvh,160px);animation:chk .7s both}
@keyframes chk{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.check circle{fill:#3a0000;stroke:#ff2a2a;stroke-width:5}
.check path{fill:none;stroke:#ff2a2a;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.items{width:96vw;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.it{border-radius:14px;padding:14px;text-align:right;font-size:clamp(15px,4.6vw,21px);font-weight:700;direction:ltr}
.it .bar{width:100%;height:8px;margin-top:8px}
.shake{animation:sh .35s 3}@keyframes sh{25%{transform:translate(6px,-4px)}50%{transform:translate(-6px,4px)}75%{transform:translate(4px,6px)}}
.flash{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:4}.flash.go{animation:fl .5s}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}

.check path{stroke-dasharray:50;stroke-dashoffset:50;animation:dr .5s forwards}
.check path.p1{animation-delay:.4s}.check path.p2{animation-delay:.8s}
@keyframes dr{to{stroke-dashoffset:0}}
#app.safe .app.hit svg{filter:drop-shadow(0 0 8px #39ff6e88)}
.shield{width:min(26vw,15dvh,110px);filter:drop-shadow(0 0 16px #00e676aa);animation:chk .7s both}
.msg{width:100%;font-size:clamp(28px,8.6vw,46px);font-weight:900;line-height:1.6;color:#39ff6e;padding:0 8px;text-shadow:0 0 8px #39ff6e,0 0 28px #00c853,0 0 60px #00c85366}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 22px;border-radius:40px;background:#0a2e18;border:2px solid #39ff6e;color:#eafff1;font-size:clamp(20px,6vw,30px);font-weight:800;box-shadow:0 0 22px #00e67655}
.it{background:#06210f;border:1px solid #1f7a45}
.it small{color:#7dffaa;font-size:clamp(12px,3.6vw,16px);font-weight:500}
.it .bar{background:#0a3a1c}.it .bar i{transition:width 1.4s;background:linear-gradient(90deg,#00c853,#39ff6e)}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const DUR=5,STEP=1500;
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
function flash(){const f=$('fl');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
const cv=$('rain'),c=cv.getContext('2d');let cols,drops;
function rs(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);drops=Array(cols).fill(0).map(()=>Math.random()*50)}
rs();addEventListener('resize',rs);
setInterval(()=>{c.fillStyle='rgba(0,0,0,.12)';c.fillRect(0,0,cv.width,cv.height);c.fillStyle=$('app').classList.contains('safe')?'#3f9':'#f33';c.font='14px monospace';
drops.forEach((y,i)=>{c.fillText(Math.random()>.5?'1':'0',i*16,y*16);drops[i]=y*16>cv.height&&Math.random()>.97?0:y+1})},50);
const icon=(bg,inner)=>`<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="${bg}"/>${inner}</svg>`;
const APPS=[
['Facebook',icon('#1877f2','<text x="38" y="58" font-size="62" font-weight="900" fill="#fff" text-anchor="middle" font-family="Arial">f</text>')],
['WhatsApp',icon('#25d366','<circle cx="32" cy="31" r="17" fill="none" stroke="#fff" stroke-width="5"/><path d="M15 50l4-12 8 8z" fill="#fff"/><path d="M26 25c0 8 6 14 14 14l2-4-5-2-2 2c-3-1-5-3-6-6l2-2-2-5z" fill="#fff"/>')],
['Instagram',icon('#d62976','<defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".4" stop-color="#fa7e1e"/><stop offset=".7" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#ig)"/><rect x="14" y="14" width="36" height="36" rx="11" fill="none" stroke="#fff" stroke-width="5"/><circle cx="32" cy="32" r="8" fill="none" stroke="#fff" stroke-width="5"/><circle cx="43" cy="21" r="3" fill="#fff"/>')],
['card',icon('#0b5d3b','<rect x="9" y="17" width="46" height="30" rx="5" fill="#fff"/><rect x="9" y="24" width="46" height="7" fill="#0b5d3b"/><rect x="14" y="38" width="14" height="4" fill="#0b5d3b"/>')],
['فيديوهات',icon('#c4302b','<rect x="10" y="18" width="44" height="28" rx="8" fill="#fff"/><path d="M28 25l12 7-12 7z" fill="#c4302b"/>')],
['Google',icon('#fff','<text x="32" y="47" font-size="42" font-weight="900" text-anchor="middle" font-family="Arial" fill="#4285f4">G</text><path d="M32 10a22 22 0 0 1 19 11" stroke="#ea4335" stroke-width="6" fill="none"/><path d="M51 43a22 22 0 0 1-19 11" stroke="#34a853" stroke-width="6" fill="none"/>')],
['Gmail',icon('#fff','<path d="M10 20l22 17 22-17v26H10z" fill="#ea4335"/><path d="M10 20l22 17 22-17" fill="none" stroke="#b31412" stroke-width="3"/>')],
['صور',icon('#222','<rect x="12" y="16" width="40" height="32" rx="5" fill="#fff"/><circle cx="26" cy="27" r="4" fill="#f90"/><path d="M14 46l14-13 10 9 6-5 8 9z" fill="#3a9"/>')]];
const appHTML=a=>`<div class="app">${a[1]}<span>${a[0]}</span></div>`;
$('apps').innerHTML=APPS.map(appHTML).join('');$('apps1').innerHTML=APPS.map(appHTML).join('');
const LOGS=['> accessing /DCIM/Camera','> reading saved passwords','> copying contacts & chats','> extracting card data','> uploading videos','> bypassing protection'];
let timers=[];const T=(f,t)=>timers.push(setTimeout(f,t));
let ready=false,running=false,finished=false;
const ITEMS=['🔑 passwords','🖼️ images','🎬 videos','💳 cards'];
$('items').innerHTML=ITEMS.map(i=>`<div class="it">${i}<br><small>checking…</small><div class="bar"><i></i></div></div>`).join('');
function resetUI(){
 $('app').classList.remove('danger','safe');
 document.querySelectorAll('.it .bar i').forEach(b=>b.style.width=0);
 document.querySelectorAll('.it small').forEach(s=>s.textContent='checking…');
}
function finalStage(){
 $('app').classList.remove('danger');$('app').classList.add('safe');show('s3');
 document.querySelectorAll('.it').forEach((it,i)=>setTimeout(()=>{it.querySelector('i').style.width='100%';setTimeout(()=>it.querySelector('small').textContent='safe ✓',1400)},600+i*350));
}

function run(){
 timers.forEach(clearTimeout);timers=[];running=true;finished=false;
 resetUI();
 document.querySelectorAll('.app').forEach(a=>a.classList.remove('hit'));
 $('num').textContent='1';$('ring').style.setProperty('--p','0%');$('pct').textContent='SCANNING 0%';$('sub').textContent='> initializing…';
 show('s1');$('pb').style.transition='none';$('pb').style.width='0';
 const a1=document.querySelectorAll('#apps1 .app');
 for(let n=1;n<=DUR;n++)T(()=>{
  $('num').textContent=n;$('num').classList.remove('pop');void $('num').offsetWidth;$('num').classList.add('pop');
  $('ring').style.setProperty('--p',(n/DUR*100)+'%');
  $('sub').textContent=LOGS[(n-1)%LOGS.length];$('pct').textContent='SCANNING '+Math.round(n/DUR*100)+'%';
  $('pb').style.transition='width '+(STEP/1000)+'s linear';$('pb').style.width=(n/DUR*100)+'%';
  const upto=Math.ceil(n/DUR*a1.length);
  a1.forEach((a,k)=>{if(k<upto)setTimeout(()=>a.classList.add('hit'),k*60)});
 },(n-1)*STEP);
 const t1=DUR*STEP;
 T(()=>{show('s2');$('app').classList.add('danger');flash();$('app').classList.add('shake');setTimeout(()=>$('app').classList.remove('shake'),1100)},t1);
 T(()=>{finalStage();finished=true;running=false},t1+4600);
}
// البدء فقط بعد اكتمال التحميل وفك ترميز الصورة وظهور الصفحة فعليًا للمستخدم
function tryStart(){if(ready&&!running&&!finished&&document.visibilityState==='visible')run()}
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'&&running&&!finished){timers.forEach(clearTimeout);timers=[];running=false;resetUI();show('s1');$('num').textContent='1';$('ring').style.setProperty('--p','0%');$('pb').style.transition='none';$('pb').style.width='0'}
 else tryStart();
});
addEventListener('pageshow',e=>{if(e.persisted){finished=false;running=false;tryStart()}});
const loaded=new Promise(r=>document.readyState==='complete'?r():addEventListener('load',r,{once:true}));
const img=$('eagle'),decoded=img.decode?img.decode().catch(()=>{}):Promise.resolve();
const fonts=(document.fonts&&document.fonts.ready)||Promise.resolve();
Promise.all([loaded,decoded,fonts]).then(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>setTimeout(()=>{ready=true;tryStart()},400))));
</script></body></html>
